name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'
      - name: Build
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -o dist/gdocs-markdown-sync-${{ matrix.goos }}${ext} ./cmd/gdocs-markdown-sync
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}
          path: dist/*

  publish:
    name: Create GitHub release & upload assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts (linux)
        uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist
      - name: Download build artifacts (darwin)
        uses: actions/download-artifact@v4
        with:
          name: dist-darwin
          path: dist
      - name: Download build artifacts (windows)
        uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: Release for ${{ github.ref_name }}
          draft: false
          prerelease: false
      - name: Upload assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ steps.create_release.outputs.upload_url }}
        run: |
          for f in dist/*; do
            fname=$(basename "$f")
            echo "Uploading $fname"
            curl -sS --fail -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @"$f" "$UPLOAD_URL?name=$fname"
          done
