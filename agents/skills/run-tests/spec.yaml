name: run-tests
description: Run test suite in the devcontainer image and return structured results
inputs:
  packages:
    type: array
    items: string
    description: list of packages or ['./...']
    required: false
outputs:
  status:
    type: string
    description: 'ok or fail'
  failed_packages:
    type: array
    items: string
  summary:
    type: string
  logs:
    type: string
preconditions:
  - repository root is present
  - Docker Engine or Docker Desktop is available on the host, unless already inside the devcontainer
depends_on:
  - run-in-devcontainer
run:
  - cmd: make test
    cwd: $REPO_ROOT
